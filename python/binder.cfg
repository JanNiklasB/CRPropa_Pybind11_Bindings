# # explicitly add and remove the namespaces

+namespace crpropa
+namespace std
+namespace ""
-namespace kiss
-namespace HepPID
-namespace nanoflann
-namespace zstream
-namespace quimby

# # add enums manually

+enum crpropa::interpolationType
+enum crpropa::Type
+enum crpropa::TF17DiskModel
+enum crpropa::TF17HaloModel
+enum crpropa::ModelType
+enum crpropa::EPar
+enum crpropa::DetectionState
+enum crpropa::OutputColumn
+enum crpropa::OutputType

# also ignore Variant for now, it compiles but gives the error when importing in python:
# ImportError: overloading a method with both static and instance methods is not supported; error while attempting to bind static method Variant.getTypeName(t: crpropa.crpropa.Variant.Type) -> str
# Variant is also only needed for the properties, those are mapped manually where they are needed like done with the SWIG interface
-class crpropa::Variant

# ignore some functions that should not be accessible
-function crpropa::addReferenceIf
-function crpropa::removeReferenceIf
# manually overwrite the following functions
-function crpropa::Candidate::getProperty
-function crpropa::Candidate::setProperty
-function crpropa::Output::enableProperty
# add global scope functions that were not detected
+function setLogLevel

# # overwrites and manual bindings:

+include_for_class crpropa::Vector3 <extraBindings/Vector3.h>
# ignore complex numbers for now
-class crpropa::Vector3<std::complex<double>>
+binder crpropa::Vector3 crpropa_bindings::Vector3_binder

# need to make it specific for Vector3 otherwise it is defined in multiple files despite header guards...
+include_for_class crpropa::Vector3 <extraBindings/Units.h>
+add_on_binder_for_namespace crpropa crpropa_bindings::binder_for_crpropa_units

# expansions:
+include_for_class crpropa::ParticleCollector <extraBindings/ParticleCollector.h>
+add_on_binder crpropa::ParticleCollector crpropa_bindings::ParticleCollector_binder

+include_for_class crpropa::ModuleList <extraBindings/ModuleList.h>
+add_on_binder crpropa::ModuleList crpropa_bindings::ModuleList_binder

+include_for_class crpropa::Candidate <extraBindings/Candidate.h>
+add_on_binder crpropa::Candidate crpropa_bindings::Candidate_binder

+include_for_class crpropa::Output <extraBindings/Output.h>
+add_on_binder crpropa::Output crpropa_bindings::Output_binder

# # Additional header that should be included in every binding file and that should be ignored in every binding file

